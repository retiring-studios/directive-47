name: Manual verification

# The definition of done includes a pass by the maintainer over the things that
# cannot be verified by automated testing — whether the panel reads at a glance,
# whether the tray icon looks like anything, whether the overlay sits where it
# should. No test asserts those, and a green suite says nothing about them.
#
# GitHub does not allow approving your own pull request, so the attestation is a
# label rather than a review, and this check reads the label rather than taking
# it on trust. Applying `verified` turns it green. Pushing a commit strips the
# label and it goes red again, because a pass attests to what was looked at, not
# to the pull request's title.
#
# Ubuntu on purpose, and not a contradiction of the Windows-only rule: that rule
# is about where the product is built and tested, and this job compiles nothing.
# It reads one label.

on:
    pull_request:
        types: [opened, reopened, synchronize, labeled, unlabeled]

permissions:
    contents: read
    pull-requests: write

jobs:
    manual-verification:
        name: manual-verification
        runs-on: ubuntu-latest

        steps:
            # New commits invalidate the pass. Removing the label here rather
            # than trusting the author to remember is the difference between a
            # gate and a note asking for one.
            - name: Strip the label when new commits arrive
              if: github.event.action == 'synchronize'
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  gh api --method DELETE \
                    "repos/${{ github.repository }}/issues/${{ github.event.pull_request.number }}/labels/verified" \
                    && echo "Stripped the verified label; this pull request needs another pass." \
                    || echo "No verified label to strip."

            - name: Require the label
              env:
                  GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
              run: |
                  labels=$(gh pr view "${{ github.event.pull_request.number }}" \
                    --repo "${{ github.repository }}" --json labels --jq '.labels[].name')

                  echo "Labels: ${labels:-（none）}"

                  if echo "$labels" | grep -qx "verified"; then
                      echo "Verified by the maintainer."
                      exit 0
                  fi

                  echo "::error::No manual verification pass. Download the exe from the" \
                    "Build, test and publish run, look at what automation cannot check," \
                    "then apply the 'verified' label."
                  exit 1
