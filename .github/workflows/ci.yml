name: CI

# Windows, and only Windows. Directive 47 is a Windows product — WPF, SteamVR,
# and a game that runs nowhere else — so a Linux job was proving a portability
# claim nothing depends on. One Windows runner builds every project including
# the net10.0-windows ones, which is what lets the panel's layout snapshots gate
# a pull request instead of waiting for a manual pass.
#
# What this still cannot do is Tier 2. Microphones, WASAPI, hotkeys, SendInput
# and the SteamVR overlay need real hardware, and no hosted runner has any.
# Those live in hardware.slnf and run on the dev PC. ci.slnf is everything else.
#
# Every run also publishes the panel and attaches it, so a pull request carries
# the thing a manual pass installs rather than something to be built by hand.
# Being one Windows job is why that is four extra steps and not a second job
# with its own checkout and restore.

on:
    push:
        branches: [main]
    pull_request:

permissions:
    contents: read

jobs:
    build:
        name: Build, test and publish
        runs-on: windows-latest

        steps:
            - uses: actions/checkout@v7

            # Reads global.json, so the pinned SDK band is stated in exactly one
            # place and CI cannot drift from the dev machine.
            - uses: actions/setup-dotnet@v6
              with:
                  global-json-file: global.json

            - name: Restore
              run: dotnet restore ci.slnf

            - name: Build
              run: dotnet build ci.slnf --no-restore --configuration Release

            - name: Test
              run: dotnet test ci.slnf --no-build --configuration Release

            # The version lives in exactly one place, and this is how everything
            # downstream learns it rather than being told it twice.
            - name: Read the version
              id: version
              run: |
                  $version = (dotnet msbuild src/D47.Panel/D47.Panel.csproj -getProperty:Version).Trim()
                  if (-not $version) { throw "Directory.Build.props did not yield a Version." }
                  "version=$version" >> $env:GITHUB_OUTPUT
                  Write-Host "Publishing version $version"

            # Self-contained on purpose: the artifact is what a manual pass
            # installs and runs, and it has to work on a machine with no .NET
            # on it. Single file for the same reason. Not trimmed — trimming
            # and WPF's reflection over XAML do not get along.
            - name: Publish the panel
              run: >
                  dotnet publish src/D47.Panel/D47.Panel.csproj
                  --configuration Release
                  --runtime win-x64
                  --self-contained true
                  -p:PublishSingleFile=true
                  -p:IncludeNativeLibrariesForSelfExtract=true
                  --output publish

            # The done-when says the artifact's version matches the property.
            # Asserting it here is what makes that a fact rather than a hope:
            # publish silently producing a stale or default version is exactly
            # the failure nobody notices until an installed build reports the
            # wrong number.
            - name: Check the exe carries that version
              run: |
                  $expected = "${{ steps.version.outputs.version }}"
                  $exe = Get-Item publish/D47.Panel.exe
                  $actual = $exe.VersionInfo.ProductVersion
                  Write-Host "Expected $expected, exe reports $actual, $([math]::Round($exe.Length / 1MB)) MB"
                  if (-not $actual.StartsWith($expected)) {
                      throw "The published exe reports $actual, not $expected."
                  }

            # if-no-files-found: error is the third done-when. Without it a
            # publish that produced nothing uploads nothing and passes, which
            # reads as a green build with an artifact and is neither.
            - name: Attach the exe to the pull request
              uses: actions/upload-artifact@v7
              with:
                  name: D47.Panel-${{ steps.version.outputs.version }}
                  path: publish/D47.Panel.exe
                  if-no-files-found: error
                  # A self-contained WPF exe is about 165MB. Ninety days of
                  # those, one per pull request, is a lot of storage for
                  # something whose whole purpose is to be downloaded once and
                  # tried. The release channels are what keep a build for good.
                  retention-days: 14
